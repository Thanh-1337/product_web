<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <style>
      /* Hiệu ứng nẩy ảnh lên trên khi hover */
      .hover-float {
        /* Khai báo chuyển động mượt trong 0.3 giây */
        transition:
          transform 0.3s ease,
          filter 0.3s ease;
        cursor: pointer;
      }

      .hover-float:hover {
        /* Nhích lên trên 12px theo trục Y */
        transform: translateY(-12px);
        /* Tăng độ bóng đổ gầm xe khi bay lên cho cảm giác chân thực */
        filter: drop-shadow(0 22px 18px rgba(0, 0, 0, 0.35)) !important;
      }
    </style>
  </head>

  <body>
    <!-- KHUNG BỌC NGOÀI -->
    <div
      class="col-lg-6 position-relative d-flex align-items-center justify-content-center p-4"
      style="min-height: 380px"
    >
      <!-- LỚP 1: Tấm nền cam đằng sau -->
      <div
        class="bg-danger bg-gradient rounded-5 position-absolute top-50 start-50 translate-middle shadow-lg"
        style="
          width: 75%;
          height: 75%;
          z-index: 1;
          background: linear-gradient(
            135deg,
            #ff5722 0%,
            #ff7043 100%
          ) !important;
        "
      ></div>

      <!-- LỚP 2: Ảnh sản phẩm (Thêm class hover-float) -->
      <div class="position-relative text-center w-100" style="z-index: 2">
        <img
          src="https://bizweb.dktcdn.net/thumb/large/100/620/741/themes/1067765/assets/cate_1.jpg?1784604603663"
          alt=""
          class="img-fluid hover-float"
          style="
            max-height: 350px;
            object-fit: contain;
            filter: drop-shadow(0 15px 15px rgba(0, 0, 0, 0.3));
          "
        />
      </div>
    </div>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
