<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="/assets/css/style.css" />
    <style>
      /* Khung chứa ảnh: Ẩn phần ảnh bị trào ra ngoài khi phóng to */
      .p-3.bg-white.rounded-3.border {
        overflow: hidden;
        cursor: pointer;
      }

      /* Trạng thái mặc định của ảnh: Chuyển động mượt trong 0.4s */
      #product-img {
        transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        will-change: transform;
      }

      /* Hiệu ứng khi Hover: Phóng to 1.15 lần (115%) */
      #product-img:hover {
        transform: scale(1.05);
      }
    </style>
  </head>

  <body>
    <header>
      <div id="header-placeholder"></div>
    </header>
    <main>
      <main class="py-5 bg-light">
        <div class="container">
          <!-- Breadcrumb điều hướng -->
          <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
              <li class="breadcrumb-item">
                <a href="/" class="text-decoration-none">Trang chủ</a>
              </li>
              <li class="breadcrumb-item active" aria-current="page">
                Chi tiết sản phẩm
              </li>
            </ol>
          </nav>

          <!-- Khung chi tiết sản phẩm -->
          <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-5">
              <div class="row g-4 align-items-center">
                <!-- Column 1: Hình ảnh sản phẩm -->
                <div class="col-md-6 text-center">
                  <div class="p-3 bg-white rounded-3 border">
                    <img
                      id="product-img"
                      src="/assets/images/default-product.png"
                      alt="Hình sản phẩm"
                      class="img-fluid rounded"
                      style="max-height: 400px; object-fit: contain"
                    />
                  </div>
                </div>

                <!-- Column 2: Thông tin chi tiết -->
                <div class="col-md-6">
                  <!-- Tên sản phẩm -->
                  <h2 id="product-name" class="fw-bold text-dark mb-3">
                    Đang tải tên sản phẩm...
                  </h2>

                  <!-- Giá sản phẩm -->
                  <div class="mb-3">
                    <span class="text-muted me-2">Giá bán:</span>
                    <span id="product-price" class="text-danger fw-bold fs-2">
                      0 đ
                    </span>
                  </div>

                  <!-- Nút mua hàng -->
                  <div class="d-flex gap-3 my-4">
                    <button
                      class="btn btn-primary btn-lg px-4 rounded-pill"
                      id="btn-add-to-cart"
                    >
                      <i class="fa-solid fa-cart-shopping me-2"></i>Thêm vào giỏ
                      hàng
                    </button>
                  </div>

                  <hr class="my-4" />

                  <!-- Mô tả sản phẩm -->
                  <div>
                    <h5 class="fw-bold text-secondary">Mô tả sản phẩm:</h5>
                    <p id="product-desc" class="text-muted lh-base">
                      Đang tải mô tả...
                    </p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </main>
    <footer>
      <div id="footer-placeholder"></div>
    </footer>
    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/product.js"></script>
    <script src="/assets/js/product-detail.js"></script>
  </body>
</html>
