<!-- BỌC NGOÀI DÙNG STICKY-TOP DUY NHẤT -->
<div class="sticky-top shadow-sm" style="z-index: 1030">
  <!-- 1. HEADER CHÍNH -->
  <header class="bg-white border-bottom py-3">
    <div class="container d-flex justify-content-between align-items-center gap-3">
      <!-- Logo thương hiệu -->
      <h1 class="h3 m-0 text-primary fw-bold">
        <a href="index.html" class="text-decoration-none d-flex align-items-center gap-2">
          <i class="fa-solid fa-microchip text-primary fs-3"></i>
          <span>TechStore</span>
        </a>
      </h1>

      <!-- Thanh tìm kiếm sản phẩm (Hook: searchInput) -->
      <div class="search-bar flex-grow-1 mx-2 mx-md-4" style="max-width: 440px">
        <input
          type="text"
          id="searchInput"
          class="form-control shadow-none"
          placeholder="Tìm kiếm máy tính, điện thoại, phụ kiện..."
          aria-label="Tìm kiếm sản phẩm"
        />
      </div>

      <!-- Nút mở Giỏ Hàng Offcanvas (Hook: cartOffcanvas, cartBadge) -->
      <div class="header-actions">
        <button
          type="button"
          class="btn btn-light position-relative rounded-circle p-0 d-flex align-items-center justify-content-center shadow-sm"
          data-bs-toggle="offcanvas"
          data-bs-target="#cartOffcanvas"
          id="cartTrigger"
          style="width: 48px; height: 48px"
          title="Xem giỏ hàng"
        >
          <i class="fa-solid fa-bag-shopping fs-5 text-secondary"></i>
          <span
            class="cart-badge badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle border border-light"
            id="cartBadge"
            >0</span
          >
        </button>
      </div>
    </div>
  </header>

  <!-- 2. NAVBAR ĐIỀU HƯỚNG -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark py-2">
    <div class="container">
      <button
        class="navbar-toggler border-0 shadow-none p-2"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#collapsibleNavId"
        aria-controls="collapsibleNavId"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="collapsibleNavId">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 gap-lg-1">
          <li class="nav-item">
            <a class="nav-link fw-semibold px-3 rounded-pill" href="index.html">
              <i class="fa-solid fa-house me-1"></i> Trang Chủ
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold px-3 rounded-pill" href="about.html">
              <i class="fa-solid fa-circle-info me-1"></i> Giới Thiệu
            </a>
          </li>
          <li class="nav-item dropdown">
            <a
              class="nav-link dropdown-toggle fw-semibold px-3 rounded-pill"
              href="#"
              id="dropdownId"
              role="button"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              <i class="fa-solid fa-laptop-code me-1"></i> Sản Phẩm
            </a>
            <!-- Dropdown Menu được render tự động bởi product.js -->
            <ul
              class="dropdown-menu dropdown-menu-dark shadow-lg border-secondary rounded-3 py-2 mt-2"
              aria-labelledby="dropdownId"
            ></ul>
          </li>
          <li class="nav-item">
            <a class="nav-link fw-semibold px-3 rounded-pill" href="news.html">
              <i class="fa-solid fa-newspaper me-1"></i> Tin Tức
            </a>
          </li>
          <li class="nav-item">
            <a
              class="nav-link fw-semibold px-3 rounded-pill"
              href="contact.html"
            >
              <i class="fa-solid fa-headset me-1"></i> Liên Hệ
            </a>
          </li>
        </ul>

        <!-- Hotline liên hệ nhanh -->
        <div class="d-none d-lg-flex align-items-center text-light small fw-bold bg-white bg-opacity-10 px-3 py-1.5 rounded-pill">
          <i class="fa-solid fa-phone-volume text-warning fs-5 me-2"></i>
          <span>Hotline: <span class="text-warning">1900 1234</span></span>
        </div>
      </div>
    </div>
  </nav>
</div>

<!-- 3. OFFCANVAS GIỎ HÀNG (DUY NHẤT 1 KHỐI - Hook: cartOffcanvas, cartTableBody, cartTotal, checkout()) -->
<div
  class="offcanvas offcanvas-end text-bg-dark"
  tabindex="-1"
  id="cartOffcanvas"
  aria-labelledby="cartOffcanvasLabel"
  style="width: 420px"
>
  <div class="offcanvas-header border-bottom border-secondary py-3 px-4">
    <h5 class="offcanvas-title fw-bold fs-5 text-white d-flex align-items-center gap-2" id="cartOffcanvasLabel">
      <i class="fa-solid fa-cart-shopping text-primary"></i>
      <span>Giỏ Hàng Của Bạn</span>
    </h5>
    <button
      type="button"
      class="btn-close btn-close-white"
      data-bs-dismiss="offcanvas"
      aria-label="Close"
    ></button>
  </div>
  
  <!-- Chứa danh sách các món giỏ hàng (JS render vào id cartTableBody) -->
  <div class="offcanvas-body p-4" id="cartTableBody"></div>

  <div class="offcanvas-footer border-top border-secondary p-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <span class="fs-5 fw-bold text-white">Tổng cộng</span>
      <span class="fs-4 fw-bold text-danger" id="cartTotal">0 đ</span>
    </div>
    <button
      type="button"
      class="btn btn-primary btn-lg w-100 fw-bold rounded-pill py-3 shadow-sm d-flex align-items-center justify-content-center gap-2"
      onclick="checkout()"
    >
      <i class="fa-solid fa-credit-card"></i>
      <span>Thanh Toán Ngay</span>
    </button>
  </div>
</div>
