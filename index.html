<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cửa Hàng Công Nghệ TechStore</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome (Icon) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-light">
    <!-- 1. HEADER (CHỈ CHỨA LOGO, Ô TÌM KIẾM VÀ NÚT MỞ OFFCANVAS) -->
    <header class="bg-white border-bottom sticky-top py-3">
      <div class="container d-flex justify-content-between align-items-center">
        <h1 class="h3 m-0 text-primary fw-bold">TechStore</h1>

        <div class="search-bar flex-grow-1 mx-4" style="max-width: 400px">
          <input
            type="text"
            id="searchInput"
            class="form-control"
            placeholder="Tìm kiếm sản phẩm công nghệ..."
          />
        </div>

        <div class="header-actions">
          <!-- Nút mở Giỏ Hàng Offcanvas chuẩn -->
          <button
            type="button"
            class="btn btn-light position-relative rounded-circle p-2 shadow-sm border"
            data-bs-toggle="offcanvas"
            data-bs-target="#cartOffcanvas"
            id="cartTrigger"
            style="width: 48px; height: 48px"
            title="Xem giỏ hàng"
          >
            <i class="fa-solid fa-bag-shopping fs-5 text-secondary"></i>
            <span
              class="cart-badge badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle border border-light"
              id="cartBadge"
              >0</span
            >
          </button>
        </div>
      </div>
    </header>

    <!-- 2. HERO SECTION -->
    <section class="hero-section bg-primary text-white text-center py-5">
      <div class="container hero-content py-4">
        <span class="hero-tag badge bg-warning text-dark fs-6 mb-2"
          >Bộ Sưu Tập Mới 2026</span
        >
        <h1 class="display-5 fw-bold my-2">Khám Phá Công Nghệ Đỉnh Cao</h1>
        <p class="lead mb-0">
          Trải nghiệm các thiết bị công nghệ chính hãng với ưu đãi tốt nhất.
        </p>
      </div>
    </section>

    <!-- 3. BỘ LỌC DANH MỤC -->
    <section class="filter-section bg-white py-4 mb-4 border-bottom">
      <div
        class="container filter-wrapper d-flex flex-wrap align-items-center justify-content-between gap-3"
      >
        <div
          class="category-tabs btn-group flex-wrap"
          role="group"
          id="categoryTabs"
        >
          <button
            class="tab-btn btn btn-outline-primary active"
            data-value="all"
          >
            <i class="fa-solid fa-border-all me-1"></i> Tất cả
          </button>
          <button class="tab-btn btn btn-outline-primary" data-value="laptop">
            <i class="fa-solid fa-laptop me-1"></i> Laptop
          </button>
          <button class="tab-btn btn btn-outline-primary" data-value="phone">
            <i class="fa-solid fa-mobile-screen-button me-1"></i> Điện thoại
          </button>
          <button
            class="tab-btn btn btn-outline-primary"
            data-value="accessory"
          >
            <i class="fa-solid fa-keyboard me-1"></i> Phụ kiện
          </button>
        </div>

        <div class="filter-controls">
          <select id="filterSelect" class="form-select">
            <option value="all">Tất cả danh mục</option>
            <option value="laptop">Laptop</option>
            <option value="phone">Điện thoại</option>
            <option value="accessory">Phụ kiện</option>
          </select>
        </div>
      </div>
    </section>

    <!-- 4. DANH SÁCH SẢN PHẨM -->
    <main class="container my-5">
      <h2 class="section-title h3 mb-4 fw-bold">Danh Sách Sản Phẩm Nổi Bật</h2>
      <div class="product-grid row g-4" id="productGrid"></div>
    </main>

    <!-- 5. FOOTER -->
    <footer class="bg-dark text-light text-center py-4 mt-auto">
      <div class="container">
        <p class="m-0 text-muted">
          &copy; 2026 TechStore - Bài thực hành xây dựng Website danh sách sản
          phẩm.
        </p>
      </div>
    </footer>

    <!-- ========================================================= -->
    <!-- 6. GIỎ HÀNG DẠNG OFFCANVAS TRƯỢT TỪ BÊN PHẢI (DARK THEME)  -->
    <!-- ========================================================= -->
    <div
      class="offcanvas offcanvas-end text-bg-dark"
      tabindex="-1"
      id="cartOffcanvas"
      aria-labelledby="cartOffcanvasLabel"
      style="width: 420px; background-color: #1e2229 !important"
    >
      <!-- Header của Offcanvas -->
      <div class="offcanvas-header border-bottom border-secondary py-3 px-4">
        <h5
          class="offcanvas-title fw-bold fs-5 text-white"
          id="cartOffcanvasLabel"
        >
          Giỏ hàng của bạn
        </h5>
        <button
          type="button"
          class="btn-close btn-close-white"
          data-bs-dismiss="offcanvas"
          aria-label="Close"
        ></button>
      </div>

      <!-- Body chứa danh sách sản phẩm -->
      <div class="offcanvas-body p-4" id="cartTableBody">
        <!-- JS sẽ tự động render các thẻ sản phẩm vào đây -->
      </div>

      <!-- Footer chứa tổng tiền & nút Thanh Toán -->
      <div
        class="offcanvas-footer border-top border-secondary p-4"
        style="background-color: #272c35"
      >
        <div class="d-flex justify-content-between align-items-center mb-3">
          <span class="fs-5 fw-bold text-white">Tổng cộng</span>
          <span class="fs-4 fw-bold text-danger" id="cartTotal">0 đ</span>
        </div>
        <button
          type="button"
          class="btn btn-primary btn-lg w-100 fw-bold rounded-pill py-3 shadow-sm"
          onclick="checkout()"
          style="background-color: #0d6efd; border: none"
        >
          Thanh toán ngay
        </button>
      </div>
    </div>

    <!-- SCRIPT KHAI BÁO CỦA BOOTSTRAP VÀ PRODUCT.JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/product.js"></script>
  </body>
</html>
