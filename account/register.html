<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
  </head>

  <body>
    <header>
      <div id="header-placeholder"></div>
    </header>
    <main>
      <section class="acc_layout">
        <!-- BREADCRUMB -->
        <div
          class="head-breadcrumb pt-5 overflow-hidden"
          style="
            --bg_head_breadcrumb: #fcded4;
            --ico_head_breadcrumb: url(https://file.hstatic.net/200000894447/file/wheel_eca501ad7a014a338c91dde60d0052db.png);
          "
        >
          <div class="container position-relative mt-3 mt-lg-4">
            <div class="breadcrumbs mb-3 position-relative">
              <ul
                class="align-items-center bg-transparent breadcrumb m-0 p-0 small text-uppercase"
              >
                <li class="home">
                  <a href="/" title="Trang chủ">Trang chủ</a>
                  <span class="slash-divider ml-2 mr-2">/</span>
                </li>
                <li class="active">Đăng ký</li>
              </ul>
            </div>
          </div>
        </div>

        <!-- MAIN CONTAINER -->
        <div class="container">
          <div class="row mb-4 mb-lg-5">
            <div class="col-lg-6 col-md-8 col-12 m-auto">
              <div
                class="box_log position-relative registered-users border p-4 p-md-5 rounded-10 bg-white shadow-sm"
              >
                <form
                  accept-charset="UTF-8"
                  action="/register"
                  id="create_customer"
                  method="post"
                >
                  <input
                    name="form_type"
                    type="hidden"
                    value="create_customer"
                  />
                  <input name="utf8" type="hidden" value="✓" />
                  <input
                    name="__RequestVerificationToken"
                    type="hidden"
                    value="CfDJ8FyFPV59mBtNhmQGz0fYZt-eT_cKzBB7TE94eiEZWJSMiMON83IAliPaAufMXsFjM5eqeqbdawWZ4MsmVRkVhlxWQ_z8IrbnL7up4jAAtF0Bxzz9mhh1rD_1YehkYocUXSFAXtXIJEach1OY0rpmSgc"
                  />

                  <h2 class="page_title mb-3 font-weight-bold text-center">
                    Đăng ký tài khoản
                  </h2>

                  <div
                    class="form-signup text-danger mb-2 text-center small"
                  ></div>

                  <!-- HỌ VÀ TÊN -->
                  <div class="row">
                    <div class="col-md-6 col-12">
                      <div class="form-group mb-3">
                        <label for="lastName" class="font-weight-bold small"
                          >Họ <span class="text-danger">*</span></label
                        >
                        <input
                          type="text"
                          id="lastName"
                          placeholder="Nhập Họ"
                          class="form-control mew-control rounded-10 py-2 px-3"
                          name="customer[last_name]"
                          required
                        />
                      </div>
                    </div>
                    <div class="col-md-6 col-12">
                      <div class="form-group mb-3">
                        <label for="firstName" class="font-weight-bold small"
                          >Tên <span class="text-danger">*</span></label
                        >
                        <input
                          type="text"
                          id="firstName"
                          placeholder="Nhập Tên"
                          class="form-control mew-control rounded-10 py-2 px-3"
                          name="customer[first_name]"
                          required
                        />
                      </div>
                    </div>
                  </div>

                  <!-- SỐ ĐIỆN THOẠI -->
                  <div class="form-group mb-3">
                    <label for="Phone" class="font-weight-bold small"
                      >Số điện thoại <span class="text-danger">*</span></label
                    >
                    <input
                      type="tel"
                      id="Phone"
                      placeholder="Nhập Số điện thoại"
                      pattern="(0[3|5|7|8|9]+[0-9]{8})"
                      title="Vui lòng nhập số điện thoại hợp lệ (10 chữ số)"
                      class="form-control mew-control rounded-10 py-2 px-3"
                      name="customer[phone]"
                      required
                    />
                  </div>

                  <!-- NGÀY SINH & GIỚI TÍNH -->
                  <div class="row">
                    <div class="col-md-6 col-12">
                      <div class="form-group mb-3">
                        <label for="dob" class="font-weight-bold small"
                          >Ngày sinh</label
                        >
                        <input
                          type="date"
                          id="dob"
                          class="form-control mew-control rounded-10 py-2 px-3"
                          name="customer[birthday]"
                        />
                      </div>
                    </div>
                    <div class="col-md-6 col-12">
                      <div class="form-group mb-3">
                        <label for="Gender" class="font-weight-bold small"
                          >Giới tính</label
                        >
                        <select
                          id="Gender"
                          class="form-control ui-select mew-control rounded-10 bg-white py-2 px-3"
                          name="customer[gender]"
                        >
                          <option value="male" selected>Nam</option>
                          <option value="female">Nữ</option>
                          <option value="other">Khác</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <!-- EMAIL -->
                  <div class="form-group mb-3">
                    <label for="email" class="font-weight-bold small"
                      >E-mail <span class="text-danger">*</span></label
                    >
                    <input
                      type="email"
                      id="email"
                      placeholder="Nhập địa chỉ E-mail"
                      class="form-control mew-control rounded-10 py-2 px-3"
                      name="customer[email]"
                      required
                    />
                  </div>

                  <!-- MẬT KHẨU -->
                  <div class="form-group mb-4">
                    <label for="create_password" class="font-weight-bold small"
                      >Mật khẩu <span class="text-danger">*</span></label
                    >
                    <input
                      type="password"
                      id="create_password"
                      placeholder="Nhập Mật khẩu"
                      class="form-control mew-control rounded-10 py-2 px-3"
                      name="customer[password]"
                      required
                    />
                  </div>

                  <!-- NÚT TẠO TÀI KHOẢN -->
                  <div class="form-group mb-3">
                    <button
                      type="submit"
                      class="btn btn-primary font-weight-bold rounded-10 py-3 w-100"
                    >
                      Tạo tài khoản
                    </button>
                  </div>

                  <!-- CHUYỂN SANG ĐĂNG NHẬP -->
                  <div class="text-center mt-3">
                    <span class="small text-muted">Bạn đã có tài khoản?</span>
                    <a
                      href="/account/login"
                      title="Đăng nhập"
                      class="font-weight-bold ml-1 text-primary"
                    >
                      Đăng nhập ngay
                    </a>
                  </div>

                  <!-- RECAPTCHA SCRIPT (GIỮ NGUYÊN TỪ NỀN TẢNG) -->
                  <input
                    id="15d3a7ba2dd44b4d9e89947475c605eb"
                    name="g-recaptcha-response"
                    type="hidden"
                  />
                  <script src="https://www.google.com/recaptcha/api.js?render=6LchSLkqAAAAABVHBpeFgg8N-WgkYsr5fO6GUF_s"></script>
                  <script>
                    let recaptchaElm = document.getElementById(
                      "15d3a7ba2dd44b4d9e89947475c605eb",
                    );
                    let recaptchaForm = recaptchaElm.parentNode;
                    recaptchaForm.addEventListener(
                      "submit",
                      function (formEvent) {
                        if (!recaptchaElm.value) {
                          formEvent.preventDefault();
                          grecaptcha.ready(function () {
                            grecaptcha
                              .execute(
                                "6LchSLkqAAAAABVHBpeFgg8N-WgkYsr5fO6GUF_s",
                                { action: "submit" },
                              )
                              .then(function (token) {
                                recaptchaElm.value = token;
                                recaptchaForm.requestSubmit(
                                  formEvent.submitter,
                                );
                              });
                          });
                        }
                      },
                    );
                  </script>
                </form>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <footer>
      <!-- place footer here -->
    </footer>
    <div id="footer-placeholder"></div>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="/assets/js/main.js"></script>
    <script src="/assets/js/product.js"></script>
  </body>
</html>
