<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tin Tức Công Nghệ - Cửa Hàng TechStore</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Font Awesome (Icon) -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">
    <!-- 1. HEADER + NAV + OFFCANVAS GIỎ HÀNG (Tự động nạp từ top.html) -->
    <div id="header-placeholder"></div>

    <!-- 2. BANNER TÊN TRANG -->
    <section class="py-5 text-center position-relative overflow-hidden" style="background: var(--primary-gradient);">
      <div class="container py-4 position-relative" style="z-index: 2;">
        <span class="badge bg-white bg-opacity-20 text-white fw-bold text-uppercase px-3 py-2 rounded-pill mb-3 tracking-wider">
          <i class="fa-solid fa-newspaper me-1"></i> Tin Tức & Đánh Giá
        </span>
        <h1 class="display-4 fw-bold mb-3 text-white">Tin Tức Công Nghệ</h1>
        <p class="lead mb-0 text-white-50 col-md-8 mx-auto">
          Cập nhật liên tục những xu hướng mới nhất, đánh giá sản phẩm chuyên sâu và các mẹo công nghệ hữu ích.
        </p>
      </div>
    </section>

    <!-- 3. NỘI DUNG DANH SÁCH BÀI VIẾT (Hook: about-render - JS tự động render bài viết vào đây) -->
    <main class="container about-render my-5 flex-grow-1">
      <!-- Nội dung tự động được render bởi JS (product.js) -->
    </main>

    <!-- 4. FOOTER (Tự động nạp từ bot.html) -->
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/product.js"></script>
  </body>
</html>
